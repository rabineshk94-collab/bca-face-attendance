{% extends 'base.html' %}

{% block title %}{{ action }} Student - Face Recognition Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="glass-card p-4 p-md-5">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary border-opacity-25 pb-3">
        <h3 class="fw-bold mb-0"><i class="ri-user-settings-line text-info"></i> {{ action }} Student Profile</h3>
        <a href="{% url 'student_list' %}" class="btn btn-outline-secondary btn-sm"><i class="ri-arrow-left-line"></i> Back to Roster</a>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label text-muted small">Student Roll Number *</label>
            <input type="text" name="roll_number" value="{{ student.roll_number }}" class="form-control bg-dark text-light border-secondary" required placeholder="e.g. 2026-BCA-042" {% if action == 'Edit' %}readonly{% endif %} />
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted small">Student ID *</label>
            <input type="text" name="student_id" value="{{ student.student_id }}" class="form-control bg-dark text-light border-secondary" required placeholder="e.g. BCA2026042" {% if action == 'Edit' %}readonly{% endif %} />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">Full Student Name *</label>
          <input type="text" name="name" value="{{ student.name }}" class="form-control bg-dark text-light border-secondary" required placeholder="e.g. Rahul Sharma" />
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label text-muted small">Department *</label>
            <select name="department" class="form-select bg-dark text-light border-secondary" required>
              {% for d in departments %}
                <option value="{{ d.id }}" {% if student and student.department.id == d.id %}selected{% endif %}>{{ d.name }} ({{ d.code }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted small">Academic Year *</label>
            <select name="year" class="form-select bg-dark text-light border-secondary" required>
              <option value="1st Year" {% if student.year == '1st Year' %}selected{% endif %}>1st Year</option>
              <option value="2nd Year" {% if student.year == '2nd Year' %}selected{% endif %}>2nd Year</option>
              <option value="3rd Year / Final Year" {% if student.year == '3rd Year / Final Year' or not student %}selected{% endif %}>3rd Year / Final Year</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label text-muted small">Email Address</label>
            <input type="email" name="email" value="{{ student.email|default:'' }}" class="form-control bg-dark text-light border-secondary" placeholder="student@college.edu" />
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted small">Phone Number</label>
            <input type="text" name="phone" value="{{ student.phone|default:'' }}" class="form-control bg-dark text-light border-secondary" placeholder="+91 9876543210" />
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 border-top border-secondary border-opacity-25 pt-3">
          <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-gradient px-4"><i class="ri-check-line"></i> Save Student Profile</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
